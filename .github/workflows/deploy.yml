name: Deploy to GitHub Pages

on:
  push:
    branches: [main, codex/katmai-basic, codex/av-setup]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build
      - name: Add Katmai Basic entry point
        run: |
          mkdir -p dist/basic
          cp dist/index.html dist/basic/index.html
      - name: Add Audio & Video Setup entry point
        run: |
          mkdir -p dist/av-setup
          cp dist/index.html dist/av-setup/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - uses: actions/deploy-pages@v4
        id: deployment
